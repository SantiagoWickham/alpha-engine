name: Alpha Engine - Sheet Ledger Read Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-read:
    name: Read private ledger from Sheet
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate secrets
        env:
          ALPHA_SHEET_API_URL: ${{ secrets.ALPHA_SHEET_API_URL }}
          ALPHA_SHEET_API_TOKEN: ${{ secrets.ALPHA_SHEET_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ALPHA_SHEET_API_URL:-}" || { echo "::error::Missing ALPHA_SHEET_API_URL"; exit 1; }
          test -n "${ALPHA_SHEET_API_TOKEN:-}" || { echo "::error::Missing ALPHA_SHEET_API_TOKEN"; exit 1; }
          echo "Required secrets: PRESENT"

      - name: Read operations
        env:
          ALPHA_SHEET_API_URL: ${{ secrets.ALPHA_SHEET_API_URL }}
          ALPHA_SHEET_API_TOKEN: ${{ secrets.ALPHA_SHEET_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --silent \
            --show-error \
            --location \
            --get \
            --output operations.json \
            --data-urlencode "action=operations" \
            --data-urlencode "token=${ALPHA_SHEET_API_TOKEN}" \
            "${ALPHA_SHEET_API_URL}"

          python - <<'PY'
          import json
          p=json.load(open("operations.json", encoding="utf-8"))
          if p.get("ok") is not True:
              raise SystemExit(f"operations read failed: {p}")
          headers=p.get("headers") or []
          expected={"Fecha","Cuenta","Ticker","Operación","Cantidad","Precio","Moneda"}
          if not expected.issubset(set(headers)):
              raise SystemExit(f"operations headers unexpected: {headers}")
          print("OPERATIONS_READ: PASS")
          print("operations_rows:", p.get("returned",0))
          PY

      - name: Read cash
        env:
          ALPHA_SHEET_API_URL: ${{ secrets.ALPHA_SHEET_API_URL }}
          ALPHA_SHEET_API_TOKEN: ${{ secrets.ALPHA_SHEET_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --silent \
            --show-error \
            --location \
            --get \
            --output cash.json \
            --data-urlencode "action=cash" \
            --data-urlencode "token=${ALPHA_SHEET_API_TOKEN}" \
            "${ALPHA_SHEET_API_URL}"

          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.load(open("cash.json", encoding="utf-8"))
          if p.get("ok") is not True:
              raise SystemExit(f"cash read failed: {p}")
          headers=p.get("headers") or []
          expected={"Moneda","Saldo","Actualizado","Fuente"}
          if not expected.issubset(set(headers)):
              raise SystemExit(f"cash headers unexpected: {headers}")

          rows=p.get("rows") or []
          currencies=[str(r[0]).upper() for r in rows if r]
          if "ARS" not in currencies or "USD" not in currencies:
              raise SystemExit(f"Expected ARS and USD cash rows, got {currencies}")

          print("CASH_READ: PASS")
          print("cash_rows:", p.get("returned",0))
          print("SHEET_LEDGER_READ: PASS")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Alpha Engine Sheet Ledger Read — PASS\n\n"
              "- GitHub → Sheet GET: **OK**\n"
              "- Portfolio operations readable: **YES**\n"
              "- Cash readable: **YES**\n"
              "- Sheet writes attempted: **NO**\n"
              "- Personal data printed to logs: **NO**\n",
              encoding="utf-8",
          )
          PY
