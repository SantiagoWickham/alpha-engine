name: Alpha Engine - V13 + BYMA Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/alpha_engine_production.yml'
  schedule:
    - cron: '30 19 * * 1-5'
      timezone: 'America/Argentina/Buenos_Aires'

permissions:
  contents: write

concurrency:
  group: alpha-engine-v13-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: cloud/requirements.txt

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt

      - name: Restore frozen runtime
        shell: pwsh
        run: |
          python cloud/reassemble_runtime.py
          python cloud/extract_runtime.py

      - name: Run V13 Ideal and BYMA Transfer
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File cloud/run_production.ps1

      - name: Export cloud state
        shell: pwsh
        run: python cloud/export_state.py

      - name: Publish latest state
        shell: pwsh
        run: |
          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"
          git add public/data/latest.json
          if (git diff --cached --quiet) {
            Write-Host "No state change to commit."
          } else {
            git commit -m "Production state: V13 + BYMA"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-engine-production-evidence
          path: |
            public/data/latest.json
          if-no-files-found: warn
