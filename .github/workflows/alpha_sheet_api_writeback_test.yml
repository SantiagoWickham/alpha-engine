name: Alpha Engine - Sheet API Writeback Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sheet-api-writeback:
    name: Sheet API writeback test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate required secrets
        env:
          ALPHA_SHEET_API_URL: ${{ secrets.ALPHA_SHEET_API_URL }}
          ALPHA_SHEET_API_TOKEN: ${{ secrets.ALPHA_SHEET_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ALPHA_SHEET_API_URL:-}" || { echo "::error::Missing ALPHA_SHEET_API_URL"; exit 1; }
          test -n "${ALPHA_SHEET_API_TOKEN:-}" || { echo "::error::Missing ALPHA_SHEET_API_TOKEN"; exit 1; }
          echo "Required secrets: PRESENT"

      - name: Write harmless test decision state
        env:
          ALPHA_SHEET_API_URL: ${{ secrets.ALPHA_SHEET_API_URL }}
          ALPHA_SHEET_API_TOKEN: ${{ secrets.ALPHA_SHEET_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          cat > payload.json <<'JSON'
          {
            "payload": {
              "decision_key": "CONNECTIVITY_TEST_V2",
              "model_version": "V13_CONNECTIVITY_TEST_ONLY",
              "asof": "2099-01-01",
              "source_of_truth": "GITHUB_ACTIONS_CONNECTIVITY_TEST",
              "model_authority": "PYTHON_V13_IDEAL_PLUS_BYMA_TRANSFER",
              "test_only": true,
              "note": "Harmless connectivity test. Not an investment decision."
            }
          }
          JSON

          # Apps Script ContentService responds from /exec with a redirect.
          # The doPost has already executed before that redirect is returned.
          # We deliberately DO NOT follow it. We verify the write independently
          # in the next step using the already-proven GET endpoint.
          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --output /dev/null \
              --write-out "%{http_code}" \
              --data-binary @payload.json \
              "${ALPHA_SHEET_API_URL}?action=decision_state_replace&token=${ALPHA_SHEET_API_TOKEN}"
          )"

          echo "Initial Apps Script POST status: ${HTTP_CODE}"

          case "${HTTP_CODE}" in
            200|201|202|204|301|302|303|307|308)
              echo "POST accepted by Apps Script endpoint."
              ;;
            *)
              echo "::error::Unexpected initial Apps Script POST status ${HTTP_CODE}"
              exit 1
              ;;
          esac

          sleep 2

      - name: Verify write by independent GET readback
        env:
          ALPHA_SHEET_API_URL: ${{ secrets.ALPHA_SHEET_API_URL }}
          ALPHA_SHEET_API_TOKEN: ${{ secrets.ALPHA_SHEET_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --get \
              --output read_response.json \
              --write-out "%{http_code}" \
              --data-urlencode "action=decision_state" \
              --data-urlencode "token=${ALPHA_SHEET_API_TOKEN}" \
              "${ALPHA_SHEET_API_URL}"
          )"

          echo "Readback HTTP status: ${HTTP_CODE}"
          test "${HTTP_CODE}" = "200" || { echo "::error::Readback HTTP ${HTTP_CODE}"; exit 1; }

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.load(open("read_response.json", encoding="utf-8"))
          if p.get("ok") is not True:
              raise SystemExit(f"Readback API returned failure: {p}")

          rows = p.get("rows") or []
          raw = None
          for row in rows:
              if len(row) >= 2 and str(row[0]) == "latest_runtime":
                  raw = row[1]
                  break

          if raw is None:
              raise SystemExit(f"latest_runtime row not found. First rows: {rows[:3]}")

          state = json.loads(raw)

          expected = "CONNECTIVITY_TEST_V2"
          actual = state.get("decision_key")
          if actual != expected:
              raise SystemExit(
                  "POST endpoint was reached but write was NOT verified. "
                  f"Expected decision_key={expected!r}, got {actual!r}."
              )

          if state.get("test_only") is not True:
              raise SystemExit("Readback payload is missing test_only=true")

          print("POST_ACCEPTED: PASS")
          print("READBACK: PASS")
          print("decision_key:", actual)
          print("SHEET_API_WRITEBACK: PASS")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Alpha Engine Sheet API Writeback — PASS\n\n"
              "- Initial Apps Script POST: **accepted**\n"
              "- Independent GET readback: **verified**\n"
              "- GitHub → Sheet write: **OK**\n"
              "- Sheet → GitHub read: **OK**\n"
              "- Real operations/cash/positions touched: **NO**\n",
              encoding="utf-8",
          )
          PY
